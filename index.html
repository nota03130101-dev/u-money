<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>U Money</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>U Money</h1>
      <p class="subtitle">简单记录每天的收入和支出。</p>
    </header>

    <section class="panel auth-panel" aria-labelledby="auth-title">
      <h2 id="auth-title">账号登录</h2>
      <p class="auth-status" id="authStatus">未登录。登录功能已接入，账单云同步将在下一步完成。</p>

      <form class="auth-form" id="authForm">
        <label>
          <span>邮箱</span>
          <input id="emailInput" type="email" placeholder="例如：you@example.com">
        </label>

        <label>
          <span>密码</span>
          <input id="passwordInput" type="password" placeholder="至少 6 位密码">
        </label>

        <p class="form-message" id="authMessage"></p>

        <div class="auth-actions">
          <button id="signInButton" type="button">登录</button>
          <button id="signUpButton" class="secondary-button" type="button">注册</button>
          <button id="signOutButton" class="secondary-button" type="button" hidden>退出登录</button>
        </div>
      </form>
    </section>

    <section class="balance-card" aria-label="当前余额">
      <span>当前余额</span>
      <strong id="balanceAmount">¥0.00</strong>
      <div class="summary-row">
        <p>
          <span>总收入</span>
          <b id="incomeAmount">¥0.00</b>
        </p>
        <p>
          <span>总支出</span>
          <b id="expenseAmount">¥0.00</b>
        </p>
      </div>
    </section>

    <div class="content-grid">
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">添加记录</h2>

        <form class="record-form" id="recordForm">
          <label>
            <span>日期</span>
            <input id="dateInput" type="date">
          </label>

          <label>
            <span>类型</span>
            <select id="typeInput">
              <option>支出</option>
              <option>收入</option>
            </select>
          </label>

          <label>
            <span>金额</span>
            <input id="amountInput" type="number" min="0" step="0.01" placeholder="例如：25">
          </label>

          <label>
            <span>分类</span>
            <input id="categoryInput" type="text" placeholder="例如：早餐">
          </label>

          <label>
            <span>备注</span>
            <input id="noteInput" type="text" placeholder="可以不填">
          </label>

          <p class="form-message" id="formMessage"></p>

          <button id="submitButton" type="submit">添加记录</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <h2 id="list-title">记录列表</h2>

        <ul class="record-list" id="recordList">
          <li class="empty-record">还没有记录，请先添加一条。</li>
        </ul>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
